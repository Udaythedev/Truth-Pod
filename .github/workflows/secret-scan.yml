name: Secret scan

on:
  push:
    branches: [ main, LLM ]
  pull_request:
    branches: [ main, LLM ]

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for more complete scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --verbose --redact --no-git --source . || (echo "Gitleaks found potential secrets. Review the workflow logs." && exit 1)

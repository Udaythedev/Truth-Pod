[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truthpod-device-sdk"
version = "0.1.0"
description = "Device SDK for TruthPod backend (sync and async clients)."
readme = "README.md"
requires-python = ">=3.10"
authors = [ { name = "TruthPod Contributors" } ]
license = { text = "MIT" }

dependencies = [
  "requests>=2.28",
  "httpx>=0.24",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
truthpod = "device_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["device_sdk"]

